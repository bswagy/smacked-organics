<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — smacked organics</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0710; --panel:#1E1728; --line:#2E2438;
    --bone:#F3EFEA; --stone:#9C93A8; --pink:#E3242C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--void);color:var(--bone);font-family:'Archivo',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .stamp{
    display:inline-block;background:var(--pink);color:#FFFFFF;
    font-family:'Archivo Black',sans-serif;font-size:38px;letter-spacing:0.5px;
    padding:0.05em 0.22em;margin-bottom:32px;
  }
  h1{font-family:'Archivo Black',sans-serif;font-size:64px;margin-bottom:12px;}
  p{font-size:14px;color:var(--stone);margin-bottom:28px;max-width:340px;line-height:1.6;}
  a.home-link{
    display:inline-block;background:var(--pink);color:#FFFFFF;text-decoration:none;
    font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;
    padding:14px 28px;transition:opacity .15s;
  }
  a.home-link:hover{opacity:0.85;}
</style>
</head>
<body>

<div class="stamp">SMACKED</div>
<h1>404</h1>
<p class="mono">this page doesn't exist — looks like you got smacked off course.</p>
<a href="index.html" class="home-link">back to the site</a>

</body>
</html>
